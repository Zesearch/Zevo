<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 170" role="img" aria-labelledby="title description">
  <title id="title">Zevo: from Zero to evolved</title>
  <desc id="description">A Self-Improving System For Evolving Language Models</desc>
  <style>
    .title-text {
      fill: #1f2328;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 58px;
      font-weight: 700;
    }
    .accent,
    .brand {
      fill: #e94f17;
      font-style: italic;
    }
    @media (prefers-color-scheme: dark) {
      .title-text {
        fill: #f0f6fc;
      }
      .accent,
      .brand {
        fill: #ff6a2b;
      }
    }
  </style>
  <text class="title-text" x="900" y="65" text-anchor="middle">
    <tspan class="brand">Zevo</tspan><tspan>: from </tspan><tspan class="accent">Z</tspan><tspan>ero to </tspan><tspan class="accent">evo</tspan><tspan>lved</tspan>
  </text>
  <text class="title-text" x="900" y="145" text-anchor="middle">A Self-Improving System For Evolving Language Models</text>
</svg>
