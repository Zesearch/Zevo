<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ZEVO type system: Bricolage Grotesque (display), Instrument Sans (UI),
         Spline Sans Mono (telemetry / numbers). Deliberately distinct from the
         other four Zevo skins. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spline+Sans+Mono:wght@400;500;600;700&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Zevo</title>
    <!-- Resolve the theme before first paint so a light-mode reader never sees
         a dark flash. Mirrors lib/theme.ts: saved choice, else the OS. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("zevo-theme");
          var light = saved ? saved === "light" : matchMedia("(prefers-color-scheme: light)").matches;
          if (light) document.documentElement.setAttribute("data-theme", "light");
          // Light-theme style: ?light=paper&type=site picks and remembers; the
          // dropdown in the console bar does the same.
          var q = new URLSearchParams(location.search);
          var pick = function (param, key) {
            var v = q.get(param);
            if (v) localStorage.setItem(key, v);
            return localStorage.getItem(key);
          };
          document.documentElement.setAttribute("data-light", "paper");
          var type = pick("type", "zevo-type");
          if (type) document.documentElement.setAttribute("data-type", type);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
