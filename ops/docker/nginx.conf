server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS (always at 127.0.0.11) so nginx can
    # re-resolve `backend` instead of caching the IP from container
    # startup. Without this, recreating the backend container leaves
    # nginx stuck on the old IP and every /api request returns 502.
    # valid=10s = re-resolve at least every 10 seconds.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Vite fingerprints every built asset (index-Bx2h_1hQ.js), so the name
    # changes whenever the contents do and the file can be cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: client-side routes (e.g. /runs/abc) fall through to index.html.
    #
    # index.html must NOT be cached: it is the only unfingerprinted file, and
    # it is what names the fingerprinted ones. A browser holding a stale copy
    # loads the previous build's assets from its own cache and never asks for
    # anything, so a redeploy is invisible until a hard reload — which is a
    # thing users should never need to know about.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # WebSocket endpoints under /api/ws/ must be matched BEFORE the
    # generic /api/ rule so the Upgrade headers are applied.
    # The `set $upstream ...; proxy_pass http://$upstream` pattern forces
    # nginx to resolve `backend` at request time, not at config-load time.
    location /api/ws/ {
        set                $upstream "backend:8000";
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Zevo-UI-Access "${ZEVO_UI_ACCESS_TOKEN}";
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API proxied to the backend container.
    location /api/ {
        set                $upstream "backend:8000";
        proxy_pass         http://$upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Zevo-UI-Access "${ZEVO_UI_ACCESS_TOKEN}";
        proxy_read_timeout 600s;

        # A dataset is not a form post. nginx defaults to 1 MB, which rejected
        # every training file worth uploading — and rejected it HERE, so the
        # user got a bare 413 from the proxy rather than the backend's message
        # about its own limit. That limit is 200 MB
        # (attachments.ZEVO_UPLOAD_MAX_BYTES); this matches it so the backend
        # is the thing that decides, and stays the thing that explains.
        client_max_body_size 200m;
        # Stream the body through instead of spooling all of it to a temp file
        # first: the backend already writes in 1 MB chunks with its own cap, so
        # buffering here only adds a copy of the whole upload and the wait for
        # it before anything starts.
        proxy_request_buffering off;
    }

}
